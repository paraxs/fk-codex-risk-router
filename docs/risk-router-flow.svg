<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">FK Router v0.4.0 decision flow</title>
  <desc id="desc">Explicit activation defines one work unit. Complexity selects the worker, risk selects proportionate review, hard limits constrain attempts, and the workflow stops before another roadmap phase.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10Z" fill="#38bdf8"/>
    </marker>
    <style>
      .title{font:700 36px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .sub{font:400 17px Inter,Segoe UI,Arial,sans-serif;fill:#94a3b8}
      .step{font:700 13px Inter,Segoe UI,Arial,sans-serif;fill:#38bdf8;letter-spacing:1.3px}
      .head{font:700 21px Inter,Segoe UI,Arial,sans-serif;fill:#f8fafc}
      .body{font:400 15px Inter,Segoe UI,Arial,sans-serif;fill:#cbd5e1}
      .mono{font:600 14px ui-monospace,Consolas,monospace;fill:#e2e8f0}
      .card{fill:#0f1c2e;stroke:#334155;stroke-width:1.5}
      .blue{fill:#0b2032;stroke:#0ea5e9;stroke-width:2}
      .purple{fill:#1c1734;stroke:#8b5cf6;stroke-width:2}
      .green{fill:#0d2924;stroke:#10b981;stroke-width:2}
      .orange{fill:#2b1d11;stroke:#f59e0b;stroke-width:2}
      .line{fill:none;stroke:#38bdf8;stroke-width:3;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="820" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="8" rx="4" fill="url(#accent)"/>
  <text x="56" y="62" class="title">FK Router</text>
  <text x="56" y="91" class="sub">Ein Auftrag · ein Arbeitspaket · passende Modelle · verpflichtender Stopp</text>
  <rect x="1135" y="40" width="210" height="36" rx="18" fill="#172554" stroke="#3b82f6"/>
  <text x="1240" y="64" text-anchor="middle" class="mono">v0.4.0 · explicit-only</text>

  <rect x="56" y="140" width="250" height="124" rx="18" class="card"/>
  <text x="80" y="171" class="step">01 · AKTIVIEREN</text>
  <text x="80" y="205" class="head">Expliziter Start</text>
  <text x="80" y="237" class="mono">$codex-risk-router</text>

  <path d="M306 202 H346" class="line"/>
  <rect x="348" y="124" width="310" height="156" rx="18" class="orange"/>
  <text x="372" y="155" class="step" style="fill:#fbbf24">02 · ARBEITSPAKET</text>
  <text x="372" y="189" class="head">Ein Ziel, ein Stopp</text>
  <text x="372" y="220" class="body">Roadmap ≠ Umsetzungserlaubnis</text>
  <text x="372" y="248" class="body">Standard: genau 1 Implementierungspaket</text>

  <path d="M658 202 H698" class="line"/>
  <rect x="700" y="124" width="300" height="156" rx="18" class="blue"/>
  <text x="724" y="155" class="step">03 · C/R BEWERTEN</text>
  <text x="724" y="189" class="head">Komplexität + Risiko</text>
  <text x="724" y="220" class="body">C wählt das Ausführungsmodell</text>
  <text x="724" y="248" class="body">R wählt Prüfung und Sicherung</text>

  <path d="M1000 202 H1040" class="line"/>
  <rect x="1042" y="112" width="303" height="180" rx="18" class="purple"/>
  <text x="1066" y="143" class="step" style="fill:#c4b5fd">04 · ROUTE</text>
  <text x="1066" y="177" class="head">Deterministisch</text>
  <text x="1066" y="208" class="mono">Luna · Terra · Sol · Astra</text>
  <text x="1066" y="236" class="body">Kein Extra-Koordinator ohne Grund</text>
  <text x="1066" y="264" class="body">Review: keiner · Sol · Astra</text>

  <path d="M1194 292 V352" class="line"/>
  <rect x="852" y="354" width="493" height="144" rx="18" class="green"/>
  <text x="876" y="385" class="step" style="fill:#34d399">05 · AUSFÜHREN + PRÜFEN</text>
  <text x="876" y="419" class="head">Kleinste entscheidende Checks</text>
  <text x="876" y="450" class="body">1 Worker · höchstens 2 Versuche · 1 Review falls nötig</text>
  <text x="876" y="478" class="body">Keine doppelte Diagnose oder Testschleife</text>

  <path d="M1098 498 V558" class="line"/>
  <rect x="604" y="560" width="741" height="116" rx="18" class="orange"/>
  <text x="628" y="591" class="step" style="fill:#fbbf24">06 · HARTER STOPP</text>
  <text x="628" y="625" class="head">Paket fertig, blockiert oder Budget verbraucht</text>
  <text x="628" y="654" class="body">Nie automatisch mit der nächsten Roadmap-Phase fortfahren</text>

  <path d="M604 618 H500" class="line"/>
  <rect x="56" y="548" width="442" height="140" rx="18" class="card"/>
  <text x="80" y="579" class="step">07 · BERICHT</text>
  <text x="80" y="613" class="head">Ergebnis und nächster Entscheid</text>
  <text x="80" y="644" class="body">Route · Nachweis · Restunsicherheit · Stoppgrund</text>
  <text x="80" y="672" class="body">Keine Fortsetzung ohne neue Freigabe</text>

  <text x="56" y="770" class="sub">Astra gezielt: Audit · Architektur · R7–10-Review · R8+-Planung</text>
</svg>
