<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Codex Risk Router decision flow</title>
  <desc id="desc">Astra High coordinates explicit routing. Complexity selects implementation workers; risk determines independent Astra High review. Implementation is validated, with one same-route retry and three attempts total before final reporting.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#38bdf8"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#a78bfa"/>
    </marker>
    <style>
      .title { font: 700 38px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; letter-spacing: -0.5px; }
      .subtitle { font: 400 18px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .step { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #38bdf8; letter-spacing: 1.5px; }
      .head { font: 700 22px Inter, Segoe UI, Arial, sans-serif; fill: #f8fafc; }
      .body { font: 400 16px Inter, Segoe UI, Arial, sans-serif; fill: #cbd5e1; }
      .small { font: 400 14px Inter, Segoe UI, Arial, sans-serif; fill: #94a3b8; }
      .mono { font: 600 14px ui-monospace, SFMono-Regular, Consolas, monospace; fill: #e2e8f0; }
      .pill { font: 700 13px Inter, Segoe UI, Arial, sans-serif; fill: #e0f2fe; }
      .card { fill: #0f1c2e; stroke: #334155; stroke-width: 1.5; }
      .blue-card { fill: #0b2032; stroke: #0ea5e9; stroke-width: 2; }
      .purple-card { fill: #1c1734; stroke: #8b5cf6; stroke-width: 2; }
      .green-card { fill: #0d2924; stroke: #10b981; stroke-width: 2; }
      .orange-card { fill: #2b1d11; stroke: #f59e0b; stroke-width: 2; }
      .line-blue { fill: none; stroke: #38bdf8; stroke-width: 3; marker-end: url(#arrowBlue); }
      .line-purple { fill: none; stroke: #a78bfa; stroke-width: 3; marker-end: url(#arrowPurple); }
      .line-muted { fill: none; stroke: #64748b; stroke-width: 2; stroke-dasharray: 7 7; }
    </style>
  </defs>

  <rect width="1600" height="1000" rx="28" fill="url(#bg)"/>
  <rect x="0" y="0" width="1600" height="8" rx="4" fill="url(#accent)"/>

  <text x="64" y="64" class="title">Codex Risk Router</text>
  <text x="64" y="94" class="subtitle">Astra High coordinates. Complexity selects workers. Risk sets safeguards.</text>
  <rect x="1325" y="42" width="211" height="36" rx="18" fill="#172554" stroke="#3b82f6"/>
  <text x="1430" y="65" text-anchor="middle" class="pill">v0.3.1 · explicit-only</text>

  <!-- Activation -->
  <g filter="url(#shadow)">
    <rect x="64" y="150" width="250" height="132" rx="18" class="card"/>
  </g>
  <text x="88" y="180" class="step">01 · ACTIVATE</text>
  <text x="88" y="215" class="head">Explicit trigger</text>
  <text x="88" y="244" class="mono">$codex-risk-router</text>
  <text x="88" y="267" class="small">or repository AGENTS.md</text>

  <!-- Policy -->
  <path d="M314 216 H340" class="line-blue"/>
  <g filter="url(#shadow)">
    <rect x="342" y="150" width="350" height="132" rx="18" class="card"/>
  </g>
  <text x="366" y="180" class="step">02 · LOAD POLICY</text>
  <text x="366" y="215" class="head">Project settings</text>
  <text x="366" y="244" class="mono">mode = efficient | balanced | quality</text>
  <text x="366" y="267" class="mono">astra / xhigh = auto | ask | disabled</text>

  <!-- Split to scores -->
  <path d="M692 216 H698 V177 H704" class="line-blue"/>
  <path d="M698 216 V377 H704" class="line-purple"/>

  <!-- Complexity score -->
  <g filter="url(#shadow)">
    <rect x="706" y="116" width="360" height="190" rx="18" class="blue-card"/>
  </g>
  <text x="732" y="148" class="step">03A · COMPLEXITY · C 0–10</text>
  <text x="732" y="183" class="head">Select worker</text>
  <text x="732" y="214" class="body">Ambiguity · coupling · causal depth</text>
  <text x="732" y="240" class="body">Architecture/novelty · context breadth</text>
  <rect x="732" y="260" width="308" height="28" rx="14" fill="#082f49"/>
  <text x="886" y="279" text-anchor="middle" class="pill">5 factors × 0–2 points</text>

  <!-- Risk score -->
  <g filter="url(#shadow)">
    <rect x="706" y="326" width="360" height="190" rx="18" class="purple-card"/>
  </g>
  <text x="732" y="358" class="step" style="fill:#c4b5fd">03B · RISK · R 0–10</text>
  <text x="732" y="393" class="head">Select safeguards</text>
  <text x="732" y="424" class="body">Blast radius · data/security · rollback</text>
  <text x="732" y="450" class="body">Side effects · verification strength</text>
  <rect x="732" y="470" width="308" height="28" rx="14" fill="#312e81"/>
  <text x="886" y="489" text-anchor="middle" class="pill">5 factors × 0–2 points</text>

  <!-- Worker route -->
  <path d="M1066 211 H1102" class="line-blue"/>
  <g filter="url(#shadow)">
    <rect x="1104" y="116" width="432" height="224" rx="18" class="blue-card"/>
  </g>
  <text x="1130" y="148" class="step">04A · WORKER ROUTE</text>
  <text x="1130" y="183" class="head">Mode-specific thresholds</text>
  <text x="1130" y="217" class="mono">Efficient  0–4  | 5–7 | 8–9 | 10</text>
  <text x="1130" y="247" class="mono">Balanced   0–3  | 4–6 | 7–8 | 9–10</text>
  <text x="1130" y="277" class="mono">Quality    0–2  | 3–5 | 6–7 | 8–10</text>
  <text x="1130" y="311" class="small">Luna · Terra · Sol · Astra; worker effort by task</text>

  <!-- Review route -->
  <path d="M1066 421 H1102" class="line-purple"/>
  <g filter="url(#shadow)">
    <rect x="1104" y="362" width="432" height="190" rx="18" class="purple-card"/>
  </g>
  <text x="1130" y="394" class="step" style="fill:#c4b5fd">04B · REVIEW ROUTE</text>
  <text x="1130" y="429" class="head">Astra High review</text>
  <text x="1130" y="460" class="mono">R 0–2: tests pass → no separate review</text>
  <text x="1130" y="490" class="mono">Otherwise: independent Astra High</text>
  <text x="1130" y="524" class="small">All audits/reviews: exactly Astra High</text>

  <!-- Direct gate -->
  <path d="M886 516 V572" class="line-muted"/>
  <rect x="666" y="574" width="440" height="78" rx="16" class="orange-card"/>
  <text x="690" y="604" class="step" style="fill:#fbbf24">DIRECT GATE</text>
  <text x="690" y="632" class="body">C ≤ 2 · R ≤ 2 · localized · deterministic · no review</text>

  <!-- Converge -->
  <path d="M1320 340 V606 H1136" class="line-blue"/>
  <path d="M1320 552 V640 H1136" class="line-purple"/>
  <path d="M1106 613 H1136" class="line-blue"/>

  <!-- Execute/validate -->
  <g filter="url(#shadow)">
    <rect x="1138" y="584" width="398" height="116" rx="18" class="green-card"/>
  </g>
  <text x="1164" y="616" class="step" style="fill:#34d399">05 · EXECUTE + VALIDATE</text>
  <text x="1164" y="651" class="head">Bounded task, relevant checks</text>
  <text x="1164" y="680" class="body">Targeted tests · lint/type/build · smoke test</text>

  <!-- Retry and escalation -->
  <path d="M1337 700 V744" class="line-blue"/>
  <g filter="url(#shadow)">
    <rect x="706" y="746" width="830" height="112" rx="18" class="card"/>
  </g>
  <text x="732" y="778" class="step">06 · RECOVER OR ESCALATE</text>
  <text x="732" y="814" class="head">One same-route retry; three attempts total</text>
  <text x="732" y="840" class="body">Workers: Luna → Terra → Sol → Astra · respect ceilings · stop at the attempt limit</text>

  <!-- Report -->
  <path d="M1121 858 V894" class="line-blue"/>
  <g filter="url(#shadow)">
    <rect x="362" y="896" width="1174" height="66" rx="18" class="card"/>
  </g>
  <text x="390" y="924" class="step">07 · REPORT</text>
  <text x="390" y="949" class="body">Scores · requested/runtime route · fallback · review · validation · escalation · uncertainty · optional JSONL stats</text>

  <!-- Legend -->
  <text x="64" y="930" class="small">Leadership/review: Astra High</text>
  <text x="64" y="952" class="small">Unavailable role → blocked</text>
</svg>
